<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg-plate: #0A0D10;
        --border-plate: #223244;
        --base-prism: #1E293B;
        --side-prism: #0F172A;
        --top-prism: #1E293B;
        --contour-stroke: #E07A38;
        --amber-dot: #E07A38;
        --amber-glow: rgba(224, 122, 56, 0.5);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-plate: #F3F0E8;
          --border-plate: #D1CBC0;
          --base-prism: #E2E8F0;
          --side-prism: #CBD5E1;
          --top-prism: #FFFFFF;
          --contour-stroke: #E07A38;
          --amber-dot: #E07A38;
          --amber-glow: rgba(224, 122, 56, 0.4);
        }
      }
    </style>
  </defs>

  <!-- Base Plate Frame -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="var(--bg-plate)" stroke="var(--border-plate)" stroke-width="2" />

  <!-- Outer Cartographic Range Ring -->
  <circle cx="32" cy="33" r="25" fill="none" stroke="var(--border-plate)" stroke-width="1.2" stroke-dasharray="3 3" />

  <!-- Extruded Prism Lower Depth Shadow -->
  <path d="
    M 31 10
    L 37 15
    L 45 22
    L 52 24
    L 48 30
    L 42 35
    L 39 42
    L 33 54
    L 32 58
    L 34 56
    L 41 45
    L 46 37
    L 54 27
    L 50 23
    L 40 17
    L 33 12
    Z"
    fill="var(--side-prism)" opacity="0.9" />

  <!-- Extruded Prism Boundary Geometry of India -->
  <path d="
    M 31 10
    C 33 11, 35 13, 37 15
    L 39 14
    L 43 19
    L 40 23
    L 46 22
    L 52 24
    L 51 28
    L 44 29
    L 42 34
    L 38 41
    L 36 47
    L 33 54
    C 32.5 55, 31.5 55, 31 54
    L 28 47
    L 26 41
    L 24 35
    L 17 33
    L 13 32
    L 14 26
    L 20 25
    L 23 20
    L 27 16
    Z"
    fill="var(--top-prism)"
    stroke="var(--contour-stroke)"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- Stepped Elevation Contour Ring -->
  <path d="
    M 31 15
    L 35 19
    L 40 22
    L 45 26
    L 41 28
    L 37 35
    L 35 42
    L 32 50
    L 29 42
    L 25 35
    L 19 31
    L 21 26
    L 27 21
    Z"
    fill="none"
    stroke="#F2A33A"
    stroke-width="1.2"
    stroke-dasharray="2 2"
    opacity="0.8"
  />

  <!-- Amber Hotspot Intelligence Beacon -->
  <circle cx="32" cy="33" r="6.5" fill="var(--amber-glow)" />
  <circle cx="32" cy="33" r="3.5" fill="var(--amber-dot)" />
  <circle cx="32" cy="33" r="1.4" fill="#FFFFFF" />
</svg>